[project]
name = "research-assistant"
version = "0.4.0"
description = "Reference management for an Obsidian vault: Crossref/OpenAlex to Obsidian to BibTeX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{name = "Namit Deb", email = "namitdeb739@gmail.com"}]
keywords = ["obsidian", "bibtex", "crossref", "openalex", "bibliography", "zettelkasten"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "httpx>=0.28.1",
    "pdfminer-six>=20260107",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[project.scripts]
research-assistant = "research_assistant.cli:app"

[project.urls]
Homepage = "https://github.com/namitdeb739/research-assistant"
Source = "https://github.com/namitdeb739/research-assistant"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ruff>=0.5",
    "pip-audit>=2.7",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
target-version = "py314"
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]  # asserts are expected in tests

[tool.ruff.lint.isort]
known-first-party = ["research_assistant"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The vault tests read a real Obsidian vault, which lives outside this repo and
# is nobody else's: deselected by default, run with `just test-vault`.
addopts = "-m 'not vault'"
markers = [
    "vault: requires a real Obsidian vault (deselected by default)",
]
timeout = 300
